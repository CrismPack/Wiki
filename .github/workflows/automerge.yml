name: Auto-merge CrismBot PRs

on: [pull_request, workflow_dispatch]

# The pack repos' sync (CrismBot) sends new release records as PRs. One is
# merged automatically only when it changes nothing but release records
# (docs/<pack>/data/*.json) and the site still builds with them; anything else
# waits for a review. The file check comes first, so the build never runs code
# a PR changed, and it runs with a read-only token.
jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'CrismBot' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Only release records changed
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          outside=$(printf '%s\n' "$files" | grep -Ev '^docs/[^/]+/data/[^/]+\.json$' || true)
          if [ -n "$outside" ]; then
            echo "::error::This PR changes more than release records, so it needs a review."
            printf '%s\n' "$outside"
            exit 1
          fi
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20 # The same as deploy.yml.
          cache: npm
      - name: The site builds with the new records
        run: npm ci && npm run docs:build

  approve-and-merge:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Enable auto-merge for CrismBot PRs
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
